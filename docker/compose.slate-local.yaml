# Optional local-only bridge to Slate's existing Docker network.
# The provider remains unpublished except for the existing loopback dashboard port.
services:
  dashboard:
    networks:
      default: {}
      slate-internal:
        aliases:
          - mt5-market-provider

networks:
  default: {}
  slate-internal:
    external: true
    name: ${SLATE_DOCKER_NETWORK:-slate-local_internal}
