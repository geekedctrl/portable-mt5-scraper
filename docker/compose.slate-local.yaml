# Optional local-only bridge to Slate's existing Docker network.
# The provider remains unpublished except for the existing loopback dashboard port.
services:
  dashboard:
    networks:
      default: {}
      slate-internal:
        aliases:
          - mt5-market-provider
      slate-production:
        aliases:
          - mt5-market-provider

networks:
  default: {}
  slate-internal:
    external: true
    name: ${SLATE_DOCKER_NETWORK:-slate-dev_internal}
  slate-production:
    external: true
    name: ${SLATE_PROD_DOCKER_NETWORK:-slate_internal}
